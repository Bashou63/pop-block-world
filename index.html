<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7f5ed">
<title>POP BLOCK WORLD — Private Viewer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;background:#f7f5ed;color:#354253}#stage{position:fixed;inset:0;border:0;width:100%;height:100%;display:none;background:#f7f5ed}#start{position:fixed;inset:0;display:grid;place-items:center;padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));background:radial-gradient(circle at 25% 85%,#f8e6e9 0,transparent 45%),radial-gradient(circle at 80% 12%,#e7f2fa 0,transparent 43%),#f7f5ed} .panel{width:min(580px,100%);text-align:center}.brand{font-size:clamp(12px,1.8vw,16px);font-weight:900;letter-spacing:.22em}.mark{margin:0 0 18px;color:#e5a64e;font-size:35px}h1{font-size:clamp(25px,4.2vw,38px);line-height:1.3;margin:12px 0}p{font-size:clamp(12px,1.7vw,15px);line-height:1.7;color:#687887;margin:10px auto 18px}.choose{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:14px 26px;background:#e9ad54;color:#263546;border-radius:18px;font-weight:900;cursor:pointer;box-shadow:0 9px 24px #d5a36555}input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.hint{margin-top:20px;font-size:12px;color:#798897}#error{color:#ad3f49;font-weight:700;min-height:20px}.privacy{font-size:12px;color:#7b8a97;margin-top:8px}#reset{position:fixed;right:8px;top:8px;z-index:4;display:none;border:0;background:#ffffffd9;color:#354253;border-radius:10px;font-size:12px;padding:6px 9px;opacity:.13}#reset:focus-visible{opacity:1}body.loaded #stage{display:block}body.loaded #start{display:none}body.loaded #reset{display:block}
</style></head><body>
<main id="start"><div class="panel"><div class="brand">POP BLOCK WORLD</div><div class="mark">◆</div><h1>プレゼンを開く</h1><p>iPhone内に保存した本番用HTMLを選択してください。<br>読み込んだ内容はこの端末の画面内だけで表示されます。</p><label class="choose" for="file">HTMLファイルを選択</label><input id="file" type="file" accept=".html,.htm,text/html"><div class="hint">ファイルアプリ → 保存先 → POP_BLOCK_WORLD_FULL_STORY_56.html</div><div id="error" role="alert"></div><div class="privacy">ファイルはアップロードされません。読み込み内容は保存しません。</div></div></main>
<iframe id="stage" title="POP BLOCK WORLD 本番プレゼン" sandbox="allow-scripts allow-modals" referrerpolicy="no-referrer"></iframe>
<button id="reset" aria-label="ファイルを選び直す" title="ファイルを選び直す">再読込</button>
<script>
(()=>{'use strict';const input=document.getElementById('file'),frame=document.getElementById('stage'),err=document.getElementById('error');input.addEventListener('change',async()=>{const file=input.files&&input.files[0];if(!file)return;err.textContent='';if(!/\.html?$/i.test(file.name)){err.textContent='HTMLファイルを選択してください。';return}try{const html=await file.text();if(!/<html\b|<!doctype\s+html/i.test(html)){err.textContent='HTMLファイルとして読み取れませんでした。';return}frame.srcdoc=html;document.body.classList.add('loaded');input.value='';}catch(e){err.textContent='読み込みに失敗しました。別の場所に保存して再試行してください。'}});document.getElementById('reset').addEventListener('click',()=>{frame.removeAttribute('srcdoc');document.body.classList.remove('loaded')});})();
</script></body></html>
